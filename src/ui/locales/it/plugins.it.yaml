  udev_info: Come funziona
  udev_info_title: Regole di accesso ai dispositivi Linux
  udev_info_intro: Le regole udev consentono a HaloDaemon di accedere all'hardware supportato come utente normale. HaloDaemon non installa mai queste regole autonomamente e la GUI non richiede privilegi di amministratore.
  udev_info_scope_title: Le regole seguono i plugin installati
  udev_info_scope: HaloDaemon deriva l'accesso dal manifest di ogni plugin. Le regole HID e USB corrispondono agli ID vendor e prodotto dichiarati. Le regole SMBus sono limitate ai driver chipset o ai vendor PCI delle GPU dichiarati. I plugin senza hardware Linux corrispondente non aggiungono regole.
  udev_info_install_title: Installazione manuale
  udev_info_install: Genera il file deterministico, controllalo, poi installalo a livello di sistema e ricarica udev. Ripeti l'operazione dopo aver aggiunto, rimosso o aggiornato un plugin quando lo stato richiede un intervento.
  udev_modal_current: "%{path} contiene tutte le %{count} regole necessarie ai tuoi plugin. Accesso aggiornato."
  udev_modal_outdated: "In %{path} mancano regole per %{count} plugin installati. Intervento necessario."
  udev_modal_missing: "%{count} regole generate non sono installate. Intervento necessario."
  udev_copy_command: Copia comando
  udev_command_copied: Copiato
  udev_recheck: Ricontrolla regole
  udev_rechecking: Ricontrollo…
  udev_recheck_hint: Esegui il comando in un terminale, poi ricontrolla. HaloDaemon confronta le regole generate con il file installato effettivo.
  udev_plugin_action: Regole di accesso necessarie
  udev_plugin_action_sub: Questo plugin dichiara un accesso hardware Linux assente dal file udev installato. Usa Genera regole udev qui sopra.
