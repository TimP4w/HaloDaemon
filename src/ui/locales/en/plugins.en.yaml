  udev_info: How it works
  udev_info_title: Linux device access rules
  udev_info_intro: udev rules let HaloDaemon access supported hardware as your normal user. HaloDaemon never installs these rules itself or asks the GUI for administrator privileges.
  udev_info_scope_title: Rules follow installed plugins
  udev_info_scope: HaloDaemon derives access from each plugin manifest. HID and USB rules match declared vendor and product IDs. SMBus rules are limited to declared chipset drivers or GPU PCI vendors. Plugins without matching Linux hardware declarations add no rule.
  udev_info_install_title: Manual installation
  udev_info_install: Generate the deterministic file, review it, then install it system-wide and reload udev. Repeat this after adding, removing, or updating a plugin when the status says action is needed.
